<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync</title>
    <link rel="stylesheet" href="css/lista.css">
</head>
<body>

<header>
    <div class="logo">Sync</div>

    <nav>
        <a href="#" data-action="home">Início</a>
        <a href="#" data-action="games">Jogos</a>
        <a href="#" data-action="add">Adicionar</a>
        <a href="#" data-action="manage">Gerenciar</a>
        <a href="#" data-action="contact">Contato</a>
    </nav>

    <div class="search-box">
        <input type="text" placeholder="Pesquisar jogos...">
    </div>
    <button id="theme-toggle" class="theme-toggle-btn" type="button">Tema escuro</button>
</header>

<section class="banner">
    <h1>Sync Games</h1>
</section>

<div class="categories-panel"></div>

<div class="games-toolbar">
    <button id="category-toggle" class="filter-toggle-btn" type="button" aria-label="Filtrar jogos">
        <span class="filter-icon"></span>
    </button>
</div>

<section id="add-game-section" class="add-game-section" style="display:none;">
    <h2>Adicionar Novo Jogo</h2>
    <form id="add-game-form" class="add-game-form">
        <input type="text" id="game-name" placeholder="Nome do jogo" required>
        <input type="url" id="game-image" placeholder="URL da imagem do jogo" required>
        <input type="text" id="game-categories" placeholder="Categorias (separadas por vírgula)" required>
        <input type="date" id="game-release-date" placeholder="Data de lançamento" required>
        <input type="number" id="game-price" placeholder="Preço médio (R$)" step="0.01" min="0" required>
        <textarea id="game-description" placeholder="Descrição do jogo" required></textarea>
        <textarea id="game-min-req" placeholder="Requisitos mínimos (cada item em nova linha)"></textarea>
        <textarea id="game-rec-req" placeholder="Requisitos recomendados (cada item em nova linha)"></textarea>
        <button type="submit">Adicionar jogo</button>
    </form>
</section>

<section id="manage-games-section" class="manage-games-section" style="display:none;">
    <h2>Gerenciar seus jogos</h2>
    <p class="manage-info">Edite ou remova os jogos que você adicionou. As alterações também ficam salvas no seu navegador.</p>
    <div id="manage-games-list" class="manage-list"></div>

    <form id="edit-game-form" class="edit-game-form" style="display:none;">
        <h3>Editar jogo</h3>
        <input type="text" id="edit-game-name" placeholder="Nome do jogo" required>
        <input type="url" id="edit-game-image" placeholder="URL da imagem do jogo" required>
        <input type="text" id="edit-game-categories" placeholder="Categorias (separadas por vírgula)" required>
        <input type="date" id="edit-game-release-date" placeholder="Data de lançamento" required>
        <input type="number" id="edit-game-price" placeholder="Preço médio (R$)" step="0.01" min="0" required>
        <textarea id="edit-game-description" placeholder="Descrição do jogo" required></textarea>
        <textarea id="edit-game-min-req" placeholder="Requisitos mínimos (cada item em nova linha)"></textarea>
        <textarea id="edit-game-rec-req" placeholder="Requisitos recomendados (cada item em nova linha)"></textarea>
        <div class="manage-buttons">
            <button type="submit">Salvar alterações</button>
            <button type="button" id="cancel-edit" class="cancel-btn">Cancelar</button>
        </div>
    </form>
</section>

<section id="game-detail-section" class="game-detail-section" style="display:none;">
    <button id="back-to-games" class="back-btn">← Voltar</button>
    <div id="detail-content" class="detail-content"></div>
</section>

<section class="games-container"></section>

<footer>
    <p>© 2026 Sync - Todos os direitos reservados</p>
</footer>

<script src="js/lista.js"></script>
</body>
</html>
